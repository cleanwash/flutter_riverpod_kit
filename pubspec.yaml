name: flutter_riverpod_kit
description: "A flutter_riverpod-based architecture (ref.watch, Result, UseCase, UiEventEmitter) and recommended folder structure, extending flutter_basic_kit_library."
version: 0.0.6
homepage: "https://github.com/cleanwash/flutter_riverpod_kit"
repository: "https://github.com/cleanwash/flutter_riverpod_kit"

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

# Enables `dart pub global activate flutter_riverpod_kit` + `riverpod_kit init`.
executables:
  riverpod_kit: init

dependencies:
  flutter:
    sdk: flutter
  flutter_basic_kit_library: ^0.0.3
  flutter_riverpod: ">=2.6.1 <4.0.0"
  # Used by bin/init.dart to read flutter_basic_kit_library's pubspec.
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
